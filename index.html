<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mundi Lácteos | Próximamente</title>
<meta name="description" content="Estamos preparando nuestro nuevo sitio web. Muy pronto estaremos en línea.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(135deg,#f6fbff,#dcecf9);color:#12324f;padding:24px}
main{max-width:560px}
.badge{display:inline-block;padding:6px 16px;border-radius:999px;background:#12324f;color:#fff;font-size:.85rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:24px}
h1{font-size:clamp(2.2rem,7vw,3.6rem);line-height:1.1;margin-bottom:16px}
p{font-size:1.1rem;line-height:1.6;opacity:.85}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#2a8de0;margin:28px 4px 0;animation:b 1.2s infinite ease-in-out}
.dot:nth-child(3){animation-delay:.2s}.dot:nth-child(4){animation-delay:.4s}
@keyframes b{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<main>
<span class="badge">Próximamente</span>
<h1>Mundi Lácteos</h1>
<p>Estamos preparando nuestro nuevo sitio web. Muy pronto estaremos en línea con todo lo que necesitas.</p>
<div><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
</main>
</body>
</html>
